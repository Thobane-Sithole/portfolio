server:
  # Render injects PORT; fall back to 8080 locally
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,application/json

spring:
  application:
    name: portfolio
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    mail:
      enabled: false

portfolio:
  contact:
    max-stored-messages: 200
    admin-token: ${CONTACT_ADMIN_TOKEN:change-me-locally}
    owner-email: ${OWNER_EMAIL:nqikazi150@gmail.com}
